name: CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bot_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync

    - name: Prepare settings for tests
      run: |
        cp settings.example.toml settings.toml

    - name: Run pytest
      env:
        # Real postgres CI service credentials
        DB__HOST: localhost
        DB__PORT: "5432"
        DB__USER: postgres
        DB__PASSWORD: postgres
        DB__NAME: bot_db
        # Fake values for fields not used in tests but required by Settings()
        BOT__TOKEN: fake_bot_token_for_ci
        WP__URL: http://fake-wp.local
        WP__USER: fake_user
        WP__APPLICATION_PASSWORD: fake_wp_password
        API__SERVER_SECRET_KEY: fake_api_secret_key_for_ci
        PORTMONE__PAYEE_ID: "0"
        PORTMONE__GATEWAY_URL: http://fake-portmone.local
        PORTMONE__SECRET_KEY: fake_portmone_secret
      run: |
        uv run pytest

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend dependencies and Build
      run: |
        cd frontend
        npm ci
        npm run build