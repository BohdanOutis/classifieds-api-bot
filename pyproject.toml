[project]
name = "telegram_bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.28.2",
    "alembic>=1.18.5",
    "apscheduler>=3.11.3",
    "asyncpg>=0.31.0",
    "colorama>=0.4.6",
    "fastapi[standard]>=0.141.1",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.1",
    "pyjwt[crypto]>=2.13.0",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
]

[tool.fastapi]
entrypoint = "src.api.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.16.9",
    "hupper>=1.12.1",
]