services: 
  db:
    image: postgres:16-alpine
    container_name: classifieds_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB__USER:-postgres}
      POSTGRES_PASSWORD: ${DB__PASSWORD:?DB__PASSWORD environment variable is required}
      POSTGRES_DB: ${DB__NAME:-classifieds_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB__USER:-postgres} -d ${DB__NAME:-classifieds_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classifieds_migration
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      - DB__HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classifieds_api
    restart: unless-stopped
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB__HOST=db
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal_net

  bot:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: classifieds_bot
    restart: unless-stopped
    command: python -m src.bot
    env_file:
      - .env
    environment:
      - DB__HOST=db
      - API__BASE_URL=http://api:8000/api/v1
    depends_on:
      db: 
        condition: service_healthy
      api: 
        condition: service_healthy
    networks:
      - internal_net

volumes:
  postgres_data:
    name: classifieds_postgres_data

networks:
  internal_net:
    driver: bridge